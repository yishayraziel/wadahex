name: Build WADAHEX

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal arm64 + x86_64)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Sign, notarize and package
        env:
          MACOS_CERT_APP_P12: ${{ secrets.MACOS_CERT_APP_P12 }}
          MACOS_CERT_INSTALLER_P12: ${{ secrets.MACOS_CERT_INSTALLER_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: VERSION=$(sed -nE 's/^project\(HEX1 VERSION ([0-9.]+)\)/\1/p' CMakeLists.txt) installer/mac_package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WADAHEX-mac
          path: |
            out/WADAHEX_mac.dmg
            out/WADAHEX_mac_VST3.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: |
          cmake --version
          cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(HEX1 VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\wadahex.iss
          Compress-Archive -Path build\HEX1_artefacts\Release\VST3\WADAHEX.vst3 -DestinationPath WADAHEX_win_VST3.zip
          Move-Item installer\Output\WADAHEX_win_setup.exe WADAHEX_win_setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: WADAHEX-windows
          path: |
            WADAHEX_win_setup.exe
            WADAHEX_win_VST3.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
    needs: [ macos, windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(sed -nE 's/^project\(HEX1 VERSION ([0-9.]+)\)/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.v.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: WADAHEX ${{ steps.v.outputs.version }}
          make_latest: true
          body: |
            **WADAHEX** - analog hex-pad drums, straight out of 1981. An 80s-style analog drum synth with an 8-bit chip layer. By Yishay Raziel.

            **1.4:** right-click any pad to choose its sound in a pop-up menu. Pad names now follow the loaded sound (a clap on the KICK pad reads CLAP), and Rename Pad... lets you name pads yourself. Names are saved with the project and in user kits.

            **1.3.1:** kit and sound names updated (Hex Classic, Hex Wobble, Vintage Kit 1-6, Hybrid Hex). Sounds are unchanged; existing projects load as before.

            **1.3:** hi-hat pads (HH CL / HH OP with choke), save your own kits, a SOUND browser per pad (64 vintage-matched sounds), KEYS to play a pad chromatically, analog DRIFT, and Export One-Shots to WAV.

            **1.2:** Mute (M) and Solo (S) on every pad; SELECT: MIDI makes the editor follow the pad your MIDI plays; reverb V.TONE from dark to bright.

            **1.1:** an 80s reverb on every pad (VERB + GATE for the classic gated reverb) and separate outputs per pad (*OUT: OWN*, outputs 2 KICK ... 9 PERC).

            - **Mac (Apple Silicon + Intel):** download `WADAHEX_mac.dmg`, open it and run *WADAHEX Installer.pkg*. Signed and notarized by Apple.
            - **Windows (64-bit):** download `WADAHEX_win_setup.exe` and run it. If SmartScreen warns, click *More info > Run anyway*.
            - VST3-only zips are included for manual installs. The PDF manual is inside the DMG and installed on Windows.
          files: |
            dist/WADAHEX-mac/WADAHEX_mac.dmg
            dist/WADAHEX-mac/WADAHEX_mac_VST3.zip
            dist/WADAHEX-windows/WADAHEX_win_setup.exe
            dist/WADAHEX-windows/WADAHEX_win_VST3.zip
