name: Build WADAHEX

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal arm64 + x86_64)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Ad-hoc sign
        run: |
          codesign --force --deep -s - "build/HEX1_artefacts/Release/VST3/WADAHEX.vst3"
          codesign --force --deep -s - "build/HEX1_artefacts/Release/Standalone/WADAHEX.app"
      - name: Package (.pkg inside a .dmg)
        run: |
          mkdir -p pkgroot/vst3 pkgroot/app dmg
          cp -R "build/HEX1_artefacts/Release/VST3/WADAHEX.vst3" pkgroot/vst3/
          cp -R "build/HEX1_artefacts/Release/Standalone/WADAHEX.app" pkgroot/app/
          pkgbuild --root pkgroot/vst3 --identifier com.yraziel.wadahex.vst3 --version 1.0.0 --install-location "/Library/Audio/Plug-Ins/VST3" vst3.pkg
          pkgbuild --root pkgroot/app --identifier com.yraziel.wadahex.app --version 1.0.0 --install-location "/Applications" app.pkg
          productbuild --package vst3.pkg --package app.pkg "dmg/WADAHEX Installer.pkg"
          cp docs/WADAHEX_Manual.pdf dmg/ || true
          hdiutil create -volname "WADAHEX" -srcfolder dmg -ov -format UDZO WADAHEX_mac.dmg
          (cd build/HEX1_artefacts/Release/VST3 && ditto -c -k --keepParent WADAHEX.vst3 ../../../../WADAHEX_mac_VST3.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: WADAHEX-mac
          path: |
            WADAHEX_mac.dmg
            WADAHEX_mac_VST3.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\wadahex.iss
          Compress-Archive -Path build\HEX1_artefacts\Release\VST3\WADAHEX.vst3 -DestinationPath WADAHEX_win_VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WADAHEX-windows
          path: |
            installer/Output/WADAHEX_win_setup.exe
            WADAHEX_win_VST3.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ macos, windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WADAHEX-mac/WADAHEX_mac.dmg
            dist/WADAHEX-mac/WADAHEX_mac_VST3.zip
            dist/WADAHEX-windows/WADAHEX_win_setup.exe
            dist/WADAHEX-windows/WADAHEX_win_VST3.zip
