name: Build WADAHEX

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal arm64 + x86_64)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Sign, notarize and package
        env:
          MACOS_CERT_APP_P12: ${{ secrets.MACOS_CERT_APP_P12 }}
          MACOS_CERT_INSTALLER_P12: ${{ secrets.MACOS_CERT_INSTALLER_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: installer/mac_package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WADAHEX-mac
          path: |
            out/WADAHEX_mac.dmg
            out/WADAHEX_mac_VST3.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: |
          cmake --version
          cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\wadahex.iss
          Compress-Archive -Path build\HEX1_artefacts\Release\VST3\WADAHEX.vst3 -DestinationPath WADAHEX_win_VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WADAHEX-windows
          path: |
            installer/Output/WADAHEX_win_setup.exe
            WADAHEX_win_VST3.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ macos, windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WADAHEX-mac/WADAHEX_mac.dmg
            dist/WADAHEX-mac/WADAHEX_mac_VST3.zip
            dist/WADAHEX-windows/WADAHEX_win_setup.exe
            dist/WADAHEX-windows/WADAHEX_win_VST3.zip
